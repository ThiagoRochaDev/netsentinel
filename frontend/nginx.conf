server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # All three containers run with network_mode: host (see docker-compose.yml)
    # so there's no Docker-internal DNS between services — 127.0.0.1 here is
    # the host machine's loopback, which is where the backend listens.

    location /api/ws/live {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri /index.html;
    }
}
