[project]
name = "netsentinel-tui"
version = "0.1.0"
description = "NetSentinel terminal dashboard"
requires-python = ">=3.12"
dependencies = [
    "textual>=0.60",
    "httpx>=0.27",
    "websockets>=12.0",
]

[project.scripts]
netsentinel-tui = "netsentinel_tui.__main__:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["netsentinel_tui*"]
