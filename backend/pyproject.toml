[project]
name = "netsentinel-backend"
version = "0.1.0"
description = "NetSentinel backend: collectors, alert engine, REST/WS API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.1",
    "scapy>=2.5",
    "python-nmap>=0.7.1",
    "zeroconf>=0.132",
    "websockets>=12.0",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]

[tool.ruff.lint]
# Escopo deliberadamente enxuto pra primeira vez que lint entra no projeto:
# erros reais (sintaxe, import não usado, nome indefinido), não preferência
# de estilo — evita reescrever código legado que não é o foco desta tarefa.
select = ["E9", "F"]
# F821 fica de fora: falso positivo constante em `Mapped["ClassName"]` do
# SQLAlchemy 2.0 (forward reference em string) — ruff não resolve esse padrão.
ignore = ["F821"]
