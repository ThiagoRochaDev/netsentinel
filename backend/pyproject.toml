[project]
name = "netsentinel-backend"
version = "0.1.0"
description = "NetSentinel backend: collectors, alert engine, REST/WS API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.1",
    "scapy>=2.5",
    "python-nmap>=0.7.1",
    "zeroconf>=0.132",
    "websockets>=12.0",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
